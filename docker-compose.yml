version: '3.9'

# ──────────────────────────────────────────────────────────────
#  Entorno de DESARROLLO local. No usar tal cual en produccion.
#
#  Las contrasenas ya NO tienen valor por defecto: hay que definirlas
#  en un archivo `.env` junto a este compose. Copiar `.env.docker.example`
#  y completar. Si falta alguna, Docker Compose aborta.
#
#  Los puertos publicados quedan atados a 127.0.0.1: la base y phpMyAdmin
#  no se exponen a la red local ni a internet.
# ──────────────────────────────────────────────────────────────

services:

  # ──────────────────────────────────────────
  #  MySQL 8.0
  #  Al iniciar por primera vez ejecuta
  #  automáticamente database/schema.sql
  # ──────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: nande_mysql
    restart: unless-stopped
    environment:
      # `:?` hace fallar el `docker compose up` si la variable no esta definida.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defini MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nande_puntos}
      MYSQL_USER: ${MYSQL_USER:?Defini MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defini MYSQL_PASSWORD en .env}
    ports:
      # Solo loopback: nadie fuera de esta maquina llega a la base.
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - nande_network
    healthcheck:
      # La clave se toma del entorno del contenedor, no se repite en el compose.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  #  phpMyAdmin — SOLO desarrollo
  #  Acceder en: http://127.0.0.1:8080
  #  Credenciales: las de tu .env (no hay defaults)
  #
  #  Arranca solo con el perfil `tools` para que no se levante por
  #  descuido:  docker compose --profile tools up
  # ──────────────────────────────────────────
  phpmyadmin:
    # Version fijada: `latest` rompe la reproducibilidad y puede traer
    # un cambio de imagen sin aviso.
    image: phpmyadmin:5.2.2-apache
    container_name: nande_phpmyadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:?Defini MYSQL_USER en .env}
      PMA_PASSWORD: ${MYSQL_PASSWORD:?Defini MYSQL_PASSWORD en .env}
    ports:
      - "127.0.0.1:${PMA_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nande_network

volumes:
  mysql_data:
    name: nande_mysql_data

networks:
  nande_network:
    name: nande_network
    driver: bridge
